services:

  mysql:
    image: mysql:8.0
    container_name: consent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-consent_mgt}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Schema comes from the release zip extracted by scripts/setup-openfgc.sh
      - ./openfgc/release/server/dbscripts/db_schema_mysql.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - consent-network

  openfgc:
    build:
      context: ./openfgc
      dockerfile: Dockerfile
    container_name: consent-openfgc
    ports:
      - "3000:3000"
    environment:
      OPENFGC_DB_HOSTNAME: mysql
      OPENFGC_DB_PORT: 3306
      OPENFGC_DB_NAME: ${MYSQL_DATABASE:-consent_mgt}
      OPENFGC_DB_USER: root
      OPENFGC_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - consent-network

  mock-backend:
    build:
      context: ./mock-backend
      dockerfile: Dockerfile
    container_name: consent-mock-backend
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - consent-network

  apim:
    build:
      context: .
      dockerfile: apim/Dockerfile
    container_name: consent-apim
    hostname: api-manager
    ports:
      - "9443:9443"
      - "8243:8243"
    depends_on:
      - is
    networks:
      consent-network:
        aliases:
          - api-manager

  is:
    build:
      context: .
      dockerfile: is/Dockerfile
    container_name: consent-is
    hostname: identity-server
    ports:
      - "9446:9446"
    healthcheck:
      test: ["CMD", "curl", "-k", "-s", "-o", "/dev/null", "-w", "%{http_code}", "https://localhost:9446/carbon/"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      consent-network:
        aliases:
          - identity-server

  demo-ui:
    build:
      context: .
      dockerfile: demo-ui/Dockerfile
    container_name: consent-demo-ui
    ports:
      - "3010:3010"
      - "3011:3010"
    environment:
      APIM_GW: https://api-manager:8243
      IS_BASE: https://identity-server:9446
      IS_PUBLIC_BASE: https://localhost:9446
      OPENFGC_BASE: http://openfgc:3000
      REDIRECT_URI: http://localhost:3011/auth-callback.html
      CLIENT_ID: ${BANK_CLIENT_ID:-}
      CLIENT_SECRET: ${BANK_CLIENT_SECRET:-}
    depends_on:
      - is
      - apim
      - openfgc
    networks:
      - consent-network


volumes:
  mysql-data:

networks:
  consent-network:
    driver: bridge
